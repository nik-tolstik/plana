name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  check:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    services:
      postgres:
        # зеркало Docker Hub через Amazon ECR Public — на раннерах GitHub
        # исчерпывается неподписанный pull rate limit Docker Hub
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: plana
          POSTGRES_PASSWORD: plana
          POSTGRES_DB: plana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # e2e-тесты apps/api гоняются с этой БД (см. apps/api/vitest.config.mts)
      DATABASE_URL: postgres://plana:plana@localhost:5432/plana_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
